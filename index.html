<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solibu Stories</title>

    <!-- SEO -->
    <meta
      name="description"
      content="Explore a curated library of captivating stories. Read online, track your progress, and discover your next adventure."
    />
    <!-- This file serves every route, so canonical and og:url are deliberately
         absent here. A hardcoded value would claim that /library and every
         /book/:id are duplicates of the homepage, contradicting the sitemap that
         lists them as distinct pages. useDocumentMeta points both at the displayed
         route instead; for scrapers that never run JS, absent beats wrong. -->
    <meta name="theme-color" content="#0A0705" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Solibu Stories" />
    <meta property="og:title" content="Solibu Stories — Read your favorite novels with joy" />
    <meta
      property="og:description"
      content="Explore a curated library of captivating stories. Read online, track your progress, and discover your next adventure."
    />
    <meta property="og:image" content="https://solibu-stories.vercel.app/images/logo.webp" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Solibu Stories — Read your favorite novels with joy" />
    <meta
      name="twitter:description"
      content="Explore a curated library of captivating stories. Read online, track your progress, and discover your next adventure."
    />
    <meta name="twitter:image" content="https://solibu-stories.vercel.app/images/logo.webp" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-56QD6SSTSJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-56QD6SSTSJ');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
